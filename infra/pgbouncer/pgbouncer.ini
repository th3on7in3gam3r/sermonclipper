[databases]
vesper = host=postgres port=5432 dbname=vesper

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_connect_timeout = 3
server_idle_timeout = 10
query_timeout = 0
ignore_startup_parameters = extra_float_digits

; Point DATABASE_URL at pgbouncer://user:pass@localhost:6432/vesper
; Never exceed (postgres max_connections / number of app instances)
